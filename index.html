<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#0066cc"
>

<title>Consulta Chip</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    max-width:700px;
    margin-left:auto;
    margin-right:auto;
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
}

#infoBase{
    margin-top:15px;
    text-align:center;
    color:#666;
    font-size:14px;
}

#resultado{
    margin-top:20px;
    border:1px solid #ccc;
    padding:15px;
    border-radius:8px;
    min-height:150px;
    background:#f8f8f8;
}

</style>

</head>

<body>

<h1>Consulta Chip</h1>

<input
    type="text"
    id="busca"
    placeholder="Digite ICCID ou MSISDN"
>

<button onclick="pesquisar()">
    Pesquisar
</button>

<div id="infoBase">
    Carregando base...
</div>

<div id="resultado">
    Aguardando pesquisa...
</div>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker
        .register("./service-worker.js")
        .then(() => {

            console.log(
                "Service Worker registrado."
            );

        })
        .catch((erro) => {

            console.log(
                "Service Worker não encontrado:",
                erro
            );

        });

}

</script>

</body>

</html>
